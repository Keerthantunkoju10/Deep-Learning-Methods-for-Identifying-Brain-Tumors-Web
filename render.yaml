# Render.com Blueprint Configuration for NeuroScan AI Backend
services:
  - type: web
    name: neuroscan-ai-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
