# Netlify Configuration for NeuroScan AI Fullstack Web Application

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# SPA Fallback: Redirect all web routes to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API Proxy Option: When your Python FastAPI backend is deployed on Render/Railway/Cloud,
# uncomment and set your backend URL below to proxy all /api/* requests with zero CORS issues!
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-api.onrender.com/api/:splat"
#   status = 200
#   force = true
