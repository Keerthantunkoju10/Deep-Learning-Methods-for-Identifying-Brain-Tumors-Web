# Netlify Configuration for NeuroScan AI Fullstack Web Application

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# 1. API Reverse Proxy: When the Python FastAPI backend is deployed on Render/Railway/Cloud,
# uncomment and replace with your backend URL to forward all /api/* requests with zero CORS issues.
# IMPORTANT: In Netlify, /api/* MUST appear BEFORE the /* SPA fallback rule!
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-neuroscan-backend.onrender.com/api/:splat"
#   status = 200
#   force = true

# 2. SPA Fallback: Direct all client routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
